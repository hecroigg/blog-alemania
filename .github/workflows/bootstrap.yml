name: Publish initial project

on:
  push:
    paths:
      - project.tar.gz

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack verified project files
        run: |
          tar -xzf project.tar.gz
          rm project.tar.gz
      - name: Commit project to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: build initial Germany living platform"
          git push
